appConfiguration:
  processingType: "api"
  bulkApiMaxWaitSec: 300
  bulkApiPollIntervalSec: 5
  apiVersion: "63.0"

# The AccountId column in contacts.csv holds the Account Name (human-readable).
# This mapping tells the app to treat that column as AccountId (the SF API field name).
# After the export step retrieves the real Salesforce IDs, the transform step
# replaces the account name value with the actual Salesforce Account Id.
sheets:
  - name: "contacts"
    fields:
      - name: "AccountId"
        apiName: "AccountId"

actions:
  # Step 1: Get all Accounts from Salesforce to resolve AccountId values.
  - name: "Get Accounts"
    type: "get"
    outputSheet: "Accounts"
    query: "SELECT Id, Name FROM Account"

  # Step 2: Produce a separate transformed CSV.
  - name: "Resolve Contact Accounts"
    type: "transform"
    inputSheet: "contacts"
    outputSheet: "contacts-ready"

  # Step 3: Insert the transformed rows.
  - name: "Insert Contacts"
    type: "insert"
    object: "Contact"
    inputSheet: "contacts-ready"
    outputSheet: "Inserted Contact IDs"
    fields:
      - "FirstName"
      - "LastName"
      - "Email"
      - "Phone"
      - "Title"
      - "AccountId"
