appConfiguration:
  processingType: "bulk"
  bulkApiMaxWaitSec: 300
  bulkApiPollIntervalSec: 5
  apiVersion: "63.0"

actions:
  - name: "Accounts"
    type: "get"
    outputSheet: "Accounts"
    query: "SELECT Id, Name, BillingStreet, BillingCity, BillingState, BillingCountry, Phone, Industry, Website FROM Account ORDER BY Name"

  - name: "Contacts"
    type: "get"
    outputSheet: "Contacts"
    query: "SELECT Id, FirstName, LastName, Email, Phone, Title, AccountId FROM Contact ORDER BY LastName, FirstName"

  - name: "Opportunities"
    type: "get"
    outputSheet: "Opportunities"
    query: "SELECT Id, Name, AccountId, StageName, Amount, CloseDate, Description FROM Opportunity ORDER BY Name"
