appConfiguration:
  processingType: "bulk"
  bulkApiMaxWaitSec: 300
  bulkApiPollIntervalSec: 5
  apiVersion: "63.0"

actions:
  - name: "Insert Accounts"
    type: "insert"
    object: "Account"
    inputSheet: "accounts"
    outputSheet: "Inserted Account IDs"
    fields:
      - "Name"
      - "BillingStreet"
      - "BillingCity"
      - "BillingState"
      - "BillingCountry"
      - "Phone"
      - "Industry"
      - "Website"
