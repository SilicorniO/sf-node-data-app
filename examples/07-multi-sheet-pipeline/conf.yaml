appConfiguration:
  processingType: "api"
  apiVersion: "63.0"

scriptFile: "./scripts.js"

sheets:
  - name: "Accounts"
    fields:
      - name: "Company Name"
        apiName: "Name"
      - name: "Annual Revenue"
        apiName: "AnnualRevenue"
      - name: "Employees"
        apiName: "NumberOfEmployees"
      - name: "Rating"
        apiName: "Rating"
      - name: "Description"
        apiName: "Description"
  - name: "Activities"
    fields:
      - name: "Contact Email"
        apiName: "WhoId"
      - name: "Company"
        apiName: "WhatId"
      - name: "Task Subject"
        apiName: "Subject"
      - name: "Due Date"
        apiName: "ActivityDate"
      - name: "Priority Level"
        apiName: "Priority"
      - name: "Notes"
        apiName: "Description"

actions:
  - name: "Get Existing Accounts"
    type: "get"
    outputSheet: "Salesforce Accounts"
    query: "SELECT Id, Name FROM Account"

  - name: "Prepare Account Updates"
    type: "transform"
    inputSheet: "Accounts"
    outputSheet: "Accounts Ready"

  - name: "Update Account Enrichment"
    type: "update"
    object: "Account"
    inputSheet: "Accounts Ready"
    fields:
      - "Id"
      - "AnnualRevenue"
      - "NumberOfEmployees"
      - "Rating"
      - "Description"

  - name: "Get Contacts"
    type: "get"
    outputSheet: "Contacts"
    query: "SELECT Id, Email, AccountId FROM Contact"

  - name: "Get Existing Tasks"
    type: "get"
    outputSheet: "Existing Tasks"
    query: "SELECT Id, Subject FROM Task"

  - name: "Prepare Standard Activities"
    type: "transform"
    inputSheet: "Activities"
    outputSheet: "Standard Activities"

  - name: "Prepare High Priority Activities"
    type: "transform"
    inputSheet: "Activities"
    outputSheet: "High-Priority Activities"

  - name: "Insert Standard Activities"
    type: "insert"
    object: "Task"
    inputSheet: "Standard Activities"
    outputSheet: "Inserted Standard Activity IDs"
    fields:
      - "WhoId"
      - "WhatId"
      - "Subject"
      - "ActivityDate"
      - "Priority"
      - "Status"
      - "Description"

  - name: "Insert High Priority Activities"
    type: "insert"
    object: "Task"
    inputSheet: "High-Priority Activities"
    outputSheet: "Inserted High Priority Activity IDs"
    fields:
      - "WhoId"
      - "WhatId"
      - "Subject"
      - "ActivityDate"
      - "Priority"
      - "Status"
      - "Description"
